<!-- 

Respostas
a. O evento DOMContentLoaded foi executado primeiro, pois ele não precisa esperar o carregamento completo das imagens e de outros recursos externos.
b. Sim. Imagens maiores e conexões mais lentas aumentam o tempo necessário para carregar. Isso pode atrasar a execução do evento 
load, mas normalmente não impede o DOMContentLoaded de ser executado antes.

c.
- DOMContentLoaded: é disparado quando o HTML foi completamente carregado e analisado pelo navegador.
- load: é disparado quando a página e seus recursos dependentes, como imagens, folhas de estilo e scripts, terminaram de carregar.

-->
